services:
  app:
    build: .
    ports:
      - "8081:80"
    env_file:
      - .env
    environment:
      PGHOST: database
      PGPORT: 5432
      PGUSER: gallery
      PGPASSWORD: gallery
      PGDATABASE: gallery
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gallery
      POSTGRES_USER: gallery
      POSTGRES_PASSWORD: gallery
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./nueva_galeria_dinamica.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gallery -d gallery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
